; NorsePatcher settings. The patches themselves go in the patches folder beside this file (see patches\README.txt).
[General]
; 0 trace, 1 debug, 2 info (every value set is logged), 3 warn, 4 error
uLogLevel=2
; apply every patch file at each map load (the game re-creates some objects per map)
bApplyOnMapLoad=1
; where NorsePatcher.log and dumps\ are written; empty = this folder
sLogDir=

[Dump]
; Objects written to dumps\<name>.txt at each map load, every field with its current value - how field names are
; found. One per line, e.g.
; Dump=/Game/Norse/Core/Data/Tables/DT_Stats.DT_Stats
